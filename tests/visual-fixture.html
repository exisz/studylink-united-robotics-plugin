<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Education plugin fixture</title>
  <style>html,body,#root{height:100%;margin:0;background:#0b0f0e}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "../dist/plugin.js";
    const students = Array.from({ length: 50 }, (_, index) => ({
      id: `70${11880 + index}`,
      name: `Example Student ${index + 1}`,
      branch: "Example Group - Sydney"
    }));
    mount(document.querySelector("#root"), { invoke: async () => ({
      status: "ready",
      capturedAt: "2026-09-07T08:02:00.000Z",
      page: { number: 1, shown: students.length, total: 22514 },
      students
    }) });
  </script>
</body>
</html>
