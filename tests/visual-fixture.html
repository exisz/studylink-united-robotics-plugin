<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Education plugin fixture</title>
  <style>html,body,#root{height:100%;margin:0;background:#0b0f0e}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "../dist/plugin.js";
    mount(document.querySelector("#root"), { invoke: async () => ({
      status: "ready",
      capturedAt: "2026-09-07T08:02:00.000Z",
      student: { id: "student-1", name: "Example Student", branch: "Example Branch" },
      applications: [
        { id: "app-1", provider: "Example University", status: "Incomplete", course: "Bachelor of Example Studies", updatedAt: "3 Sep 2026" },
        { id: "app-2", provider: "Sample Institute", status: "New Application", course: "Master of Sample Science", updatedAt: "24 Aug 2026" }
      ]
    }) });
  </script>
</body>
</html>
